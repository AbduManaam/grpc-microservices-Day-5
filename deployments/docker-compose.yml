services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 9539Abdu
      POSTGRES_DB: postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=9539Abdu
      - POSTGRES_DB=user

  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      - USER_SERVICE_ADDR=user-service:50051
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=9539Abdu
      - POSTGRES_DB=order

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_ADDR=user-service:50051
      - ORDER_SERVICE_ADDR=order-service:50052
      - PORT=8080
    depends_on:
      user-service:
        condition: service_started
      order-service:
        condition: service_started

# ✅ MUST be outside services
volumes:
  pgdata: