version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: 9539Abdu
      POSTGRES_DB:       postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  user-service:
    build:
      context: ..          # ← root of project
      dockerfile: user-service/Dockerfile
    depends_on:
      - postgres

  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    depends_on:
      - postgres
      - user-service

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - order-service